name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/math-test.php

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^ \* Version:[[:space:]]*$TAG$" ephemeris-forecasts-for-woocommerce.php
          grep -q "^Stable tag: $TAG$" readme.txt
      - name: Build zip
        run: bin/build-zip.sh dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on GitHub gets the freshly built zip; otherwise create one.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ephemeris-forecasts-for-woocommerce.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/ephemeris-forecasts-for-woocommerce.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
